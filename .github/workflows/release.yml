# Release automation for version tags (e.g. 2.1.0).
#
# Pushing a plain x.y.z tag runs the full gate (build -> test -> bundle),
# then packages build/Voca.app as a zip and drag-to-Applications DMG,
# and creates a GitHub Release whose body combines
# docs/releases/<tag>.md (curated English notes, required) with the notes
# GitHub auto-generates (commit/PR list and full-changelog diff link).
# A failed gate leaves no release behind. Version injected into Info.plist
# comes from the tag itself.
# 发布流程：先写 docs/releases/<tag>.md（必填英文说明），再推 x.y.z tag；
# 门禁通过后自动打包 ZIP 和 DMG 并创建 Release。

name: Release

on:
  push:
    tags:
      # Plain x.y.z tags like 2.1.0. Glob has no "+" quantifier, so each
      # segment is "one digit followed by anything".
      - "[0-9]*.[0-9]*.[0-9]*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Quality gate and GitHub release
    runs-on: xcode-27
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify toolchain
        run: |
          swift --version | head -1
          swift --version | grep -q 'Swift version 6\.[4-9]' || { echo 'This image should provide Swift 6.4+ (Xcode 27; older toolchains generate broken Bundle.module accessors)'; exit 1; }

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.resolved') }}-swift64
          restore-keys: ${{ runner.os }}-spm-

      - name: Build
        run: swift build

      - name: Test
        run: swift test

      - name: Free disk space
        run: |
          sudo rm -rf /Applications/Xcode_27.1*.app /Applications/Xcode_27.2*.app || true
          find .build -maxdepth 4 -type d \( -name 'Debug' -o -name 'debug' \) -exec rm -rf {} + 2>/dev/null || true
          df -h /

      - name: Bundle app
        run: ./build.sh

      - name: Verify release notes exist
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ ! -f "docs/releases/${TAG}.md" ]; then
            echo "docs/releases/${TAG}.md is missing; refusing to publish a release without notes." >&2
            exit 1
          fi

      - name: Package zip
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          cd build
          ditto -c -k --sequesterRsrc --keepParent Voca.app "Voca-${TAG}-macOS.zip"

      - name: Package and verify DMG
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          STAGING="$(mktemp -d)"
          MOUNT="$(mktemp -d)"
          ATTACHED=0
          cleanup() {
            if [ "$ATTACHED" -eq 1 ]; then
              hdiutil detach "$MOUNT"
            fi
            rm -rf "$STAGING" "$MOUNT"
          }
          trap cleanup EXIT
          cp -R build/Voca.app "$STAGING/Voca.app"
          ln -s /Applications "$STAGING/Applications"
          hdiutil create -volname Voca -srcfolder "$STAGING" -format UDZO \
            "build/Voca-${TAG}-macOS.dmg"
          hdiutil verify "build/Voca-${TAG}-macOS.dmg"
          hdiutil attach -readonly -nobrowse -mountpoint "$MOUNT" \
            "build/Voca-${TAG}-macOS.dmg"
          ATTACHED=1
          test -x "$MOUNT/Voca.app/Contents/MacOS/Voca"
          test "$(readlink "$MOUNT/Applications")" = /Applications
          codesign --verify --verbose "$MOUNT/Voca.app"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          # Start from GitHub's auto-generated notes (What's Changed, full changelog).
          gh release create "$TAG" \
            --title "$TAG" --verify-tag --generate-notes \
            "build/Voca-${TAG}-macOS.zip" \
            "build/Voca-${TAG}-macOS.dmg"
          # Prepend the hero image (absolute URL pinned to the tag; relative
          # paths do not resolve in release bodies), then curated English notes
          # above the generated part.
          GENERATED="$(gh release view "$TAG" --json body -q .body)"
          {
            printf "<p align='center'><img src='https://github.com/UNLINEARITY/Voca/raw/%s/docs/pictures/voca-1.png' width=90%%></p>\n\n" "$TAG"
            cat "docs/releases/${TAG}.md"
            printf '\n---\n\n'
            printf '%s\n' "$GENERATED"
          } > /tmp/release-notes.md
          gh release edit "$TAG" --notes-file /tmp/release-notes.md
